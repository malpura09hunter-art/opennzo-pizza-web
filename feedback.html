<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="OPENNZO Pizza feedback form"><title>OPENNZO — Feedback</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><nav class="nav container" aria-label="Primary navigation"><a class="brand" href="index.html">OPENNZO<span class="brand-dot">.</span></a><input class="nav-toggle" type="checkbox" id="nav-toggle"><label class="nav-toggle-label" for="nav-toggle"><span></span><span></span><span></span></label><div class="nav-links"><a href="index.html">Home</a><a href="about.html">About</a><a href="menu.html">Menu</a><a href="orders.html">Pizza Orders</a><a href="feedback.html">Feedback</a><a href="team.html">Our Team</a><a href="contact.html">Contact</a><a href="code-details.html">Code Details</a><a href="explanation.html">Explanation</a></div></nav></header><main><section class="feedback section-pad"><div class="container feedback-grid"><div><p class="eyebrow">THE LAST SLICE</p><h1>Tell us what<br><em>you think.</em></h1><p>Your feedback helps demonstrate additional HTML form controls used in the OPENNZO project.</p></div><form class="form-card light-form" action="team.html" method="get"><div class="form-row"><div class="field"><label for="name">Name</label><input id="name" name="name" type="text" placeholder="Your name" required></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@example.com"></div></div><div class="form-row"><div class="field"><label for="pizza">Pizza</label><select id="pizza" name="pizza"><option>Classic Margherita</option><option>Farmhouse</option><option>Paneer Tikka</option><option>Fiery Inferno</option><option>BBQ Chicken</option><option>Cheese Burst</option></select></div><div class="field"><label for="rating">Rating</label><select id="rating" name="rating"><option>★★★★★ — Excellent</option><option>★★★★☆ — Great</option><option>★★★☆☆ — Good</option><option>★★☆☆☆ — Fair</option></select></div></div><div class="field"><label for="feedback">Feedback</label><textarea id="feedback" name="feedback" rows="5" placeholder="Tell us about your OPENNZO experience..."></textarea></div><div class="field"><label for="recommendation">Would you recommend OPENNZO?</label><select id="recommendation" name="recommendation"><option>Absolutely</option><option>Maybe</option><option>Not yet</option></select></div><button class="btn btn-dark full" type="submit">Send Feedback <span>↗</span></button></form></div></section></main></body></html>
